line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
# E501 is delegated to the formatter; C408 is a non-semantic literal-style
# preference and should not block numerical validation.
ignore = ["N803", "N806", "E501", "C408"]

[lint.per-file-ignores]
"app/engine/primary_energy.py" = ["I001"]
"app/engine/polish_certificate_monthly.py" = ["E501"]
"tests/test_polish_certificate_monthly.py" = ["E501"]
"tests/test_formal_dual_engine.py" = ["E501"]
