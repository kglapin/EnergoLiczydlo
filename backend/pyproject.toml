[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energoliczydlo-backend"
version = "0.1.0"
description = "Backend API do obliczeń charakterystyki energetycznej budynków metodą godzinową PN-EN ISO 52016-1"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
    "pydantic>=2.9.0,<2.12.0",
    "numpy>=2.0.0,<3",
    "pandas>=2.2.0,<3",
    "pybuildingenergy>=2.0.2,<3",
    "pvlib>=0.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0,<7",
    "pytest-asyncio>=0.24.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.118.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "jupyter>=1.1.0",
    "matplotlib>=3.9.0",
]

[tool.setuptools.packages.find]
where = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["N803", "N806"]  # Allow uppercase physical-quantity names (T_e, Q_H, H_tr, etc.)

[tool.ruff.lint.per-file-ignores]
# Compatibility packages intentionally load the historical sibling module
# before importing/overriding selected names. Static name discovery cannot see
# the re-exported globals; runtime regression tests cover these wrappers.
"app/engine/*/__init__.py" = ["E402", "E501", "F821"]
"tests/test_audit_repairs.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
