name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: energoliczydlo-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    outputs:
      repair: ${{ steps.collect.outputs.repair }}
      install: ${{ steps.collect.outputs.install }}
      lint: ${{ steps.collect.outputs.lint }}
      mypy: ${{ steps.collect.outputs.mypy }}
      conformance: ${{ steps.collect.outputs.conformance }}
      audit: ${{ steps.collect.outputs.audit }}
      post_audit: ${{ steps.collect.outputs.post_audit }}
      bestest: ${{ steps.collect.outputs.bestest }}
      full_regression: ${{ steps.collect.outputs.full_regression }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - id: install
        name: Install dependencies
        run: pip install -r requirements.txt

      - id: repair
        name: Verify audited repairs are already committed
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python ../.ci/apply_repair.py 2>&1 | tee /tmp/ci-repair.log
          ruff format --check app tests 2>&1 | tee -a /tmp/ci-repair.log
          git diff --check 2>&1 | tee -a /tmp/ci-repair.log
          if ! git diff --exit-code -- app tests 2>&1 | tee -a /tmp/ci-repair.log; then
            echo "Audited repair script changed tracked source files. Commit the repair instead of letting CI mutate the PR branch." | tee -a /tmp/ci-repair.log
            exit 1
          fi

      - id: lint
        name: Lint with Ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check app tests --output-format=concise \
            --extend-per-file-ignores "app/engine/calculator/__init__.py:E402" \
            --extend-per-file-ignores "app/engine/calculator/__init__.py:F821" \
            --extend-per-file-ignores "app/engine/climate/__init__.py:F821" \
            --extend-per-file-ignores "app/engine/design_load/__init__.py:E501" \
            --extend-per-file-ignores "app/engine/ground_iso13370/__init__.py:F821" \
            --extend-per-file-ignores "app/engine/heat_recovery/__init__.py:F821" \
            --extend-per-file-ignores "app/engine/thermal_balance/__init__.py:F821" \
            --extend-per-file-ignores "app/engine/ventilation/__init__.py:F821" \
            --extend-per-file-ignores "tests/test_post_repair_audit.py:F401" \
            2>&1 | tee /tmp/ci-lint.log

      - id: mypy
        name: Type check numerical ISO 52016 modules
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mypy \
            app/engine/iso52016_hourly.py \
            app/engine/iso52016_monthly.py \
            app/engine/iso52016_moisture.py \
            app/engine/iso52016_design_load.py \
            --follow-imports=skip \
            --disable-error-code=no-untyped-def \
            --show-error-codes --no-pretty 2>&1 | tee /tmp/ci-mypy.log

      - id: conformance
        name: Run ISO 52016 conformance regressions
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest \
            tests/test_iso52016_conformance.py \
            tests/test_iso52016_monthly.py \
            tests/test_iso52016_design_load.py \
            -q -vv 2>&1 | tee /tmp/ci-conformance.log

      - id: audit
        name: Run audit repair regressions
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest tests/test_audit_repairs.py -q -vv 2>&1 | tee /tmp/ci-audit.log

      - id: post_audit
        name: Run independent post-repair audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest tests/test_post_repair_audit.py -q -vv -s 2>&1 | tee /tmp/ci-post-audit.log

      - id: bestest
        name: Run external BESTEST Case 600
        continue-on-error: true
        env:
          RUN_EXTERNAL_BENCHMARKS: "1"
        shell: bash
        run: |
          set -o pipefail
          pytest \
            tests/test_external_bestest_repaired.py::test_repaired_solver_bestest_case_600_is_inside_published_reference_band \
            -q -vv -s 2>&1 | tee /tmp/ci-bestest.log

      - id: full_regression
        name: Run full backend regression suite
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest tests -q --cov=app --cov-report=term-missing 2>&1 | tee /tmp/ci-full.log

      - id: collect
        name: Collect backend outcomes
        if: always()
        working-directory: .
        run: |
          echo "repair=${{ steps.repair.outcome }}" >> "$GITHUB_OUTPUT"
          echo "install=${{ steps.install.outcome }}" >> "$GITHUB_OUTPUT"
          echo "lint=${{ steps.lint.outcome }}" >> "$GITHUB_OUTPUT"
          echo "mypy=${{ steps.mypy.outcome }}" >> "$GITHUB_OUTPUT"
          echo "conformance=${{ steps.conformance.outcome }}" >> "$GITHUB_OUTPUT"
          echo "audit=${{ steps.audit.outcome }}" >> "$GITHUB_OUTPUT"
          echo "post_audit=${{ steps.post_audit.outcome }}" >> "$GITHUB_OUTPUT"
          echo "bestest=${{ steps.bestest.outcome }}" >> "$GITHUB_OUTPUT"
          echo "full_regression=${{ steps.full_regression.outcome }}" >> "$GITHUB_OUTPUT"

      - name: Collect backend diagnostics
        if: always()
        working-directory: .
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p ci-output/backend
          for name in repair lint mypy conformance audit post-audit bestest full; do
            source="/tmp/ci-${name}.log"
            if [ -f "$source" ]; then
              tail -n 320 "$source" > "ci-output/backend/${name}.log"
            fi
          done
          printf '%s\n' "$TESTED_SHA" > ci-output/backend/tested-sha.txt

      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-output/backend
          if-no-files-found: error
          retention-days: 14

      - name: Fail backend if any gate failed
        if: always()
        working-directory: .
        run: |
          outcomes=(
            "${{ steps.install.outcome }}"
            "${{ steps.repair.outcome }}"
            "${{ steps.lint.outcome }}"
            "${{ steps.mypy.outcome }}"
            "${{ steps.conformance.outcome }}"
            "${{ steps.audit.outcome }}"
            "${{ steps.post_audit.outcome }}"
            "${{ steps.bestest.outcome }}"
            "${{ steps.full_regression.outcome }}"
          )
          for outcome in "${outcomes[@]}"; do
            if [ "$outcome" != "success" ]; then
              exit 1
            fi
          done

  frontend:
    runs-on: ubuntu-latest
    outputs:
      install: ${{ steps.collect.outputs.install }}
      lint: ${{ steps.collect.outputs.lint }}
      typecheck: ${{ steps.collect.outputs.typecheck }}
      build: ${{ steps.collect.outputs.build }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: install
        name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - id: lint
        name: Lint
        run: pnpm lint
      - id: typecheck
        name: Type check
        run: pnpm typecheck
      - id: build
        name: Build
        run: pnpm build
      - id: collect
        name: Collect frontend outcomes
        if: always()
        working-directory: .
        run: |
          echo "install=${{ steps.install.outcome }}" >> "$GITHUB_OUTPUT"
          echo "lint=${{ steps.lint.outcome }}" >> "$GITHUB_OUTPUT"
          echo "typecheck=${{ steps.typecheck.outcome }}" >> "$GITHUB_OUTPUT"
          echo "build=${{ steps.build.outcome }}" >> "$GITHUB_OUTPUT"

  report:
    if: always() && github.event_name == 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Write final validation report
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          B_REPAIR: ${{ needs.backend.outputs.repair }}
          B_INSTALL: ${{ needs.backend.outputs.install }}
          B_LINT: ${{ needs.backend.outputs.lint }}
          B_MYPY: ${{ needs.backend.outputs.mypy }}
          B_CONFORMANCE: ${{ needs.backend.outputs.conformance }}
          B_AUDIT: ${{ needs.backend.outputs.audit }}
          B_POST_AUDIT: ${{ needs.backend.outputs.post_audit }}
          B_BESTEST: ${{ needs.backend.outputs.bestest }}
          B_FULL: ${{ needs.backend.outputs.full_regression }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          F_INSTALL: ${{ needs.frontend.outputs.install }}
          F_LINT: ${{ needs.frontend.outputs.lint }}
          F_TYPECHECK: ${{ needs.frontend.outputs.typecheck }}
          F_BUILD: ${{ needs.frontend.outputs.build }}
        run: |
          mkdir -p ci-output/report
          jq -n \
            --arg tested_sha "$TESTED_SHA" \
            --arg backend_result "$BACKEND_RESULT" \
            --arg b_repair "$B_REPAIR" \
            --arg b_install "$B_INSTALL" \
            --arg b_lint "$B_LINT" \
            --arg b_mypy "$B_MYPY" \
            --arg b_conformance "$B_CONFORMANCE" \
            --arg b_audit "$B_AUDIT" \
            --arg b_post_audit "$B_POST_AUDIT" \
            --arg b_bestest "$B_BESTEST" \
            --arg b_full "$B_FULL" \
            --arg frontend_result "$FRONTEND_RESULT" \
            --arg f_install "$F_INSTALL" \
            --arg f_lint "$F_LINT" \
            --arg f_typecheck "$F_TYPECHECK" \
            --arg f_build "$F_BUILD" \
            '{tested_sha:$tested_sha,backend:{result:$backend_result,repair:$b_repair,install:$b_install,lint:$b_lint,mypy:$b_mypy,conformance:$b_conformance,audit_repairs:$b_audit,post_repair_audit:$b_post_audit,bestest:$b_bestest,full_regression:$b_full},frontend:{result:$frontend_result,install:$f_install,lint:$f_lint,typecheck:$f_typecheck,build:$f_build}}' \
            > ci-output/report/last-run.json

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ github.event.pull_request.head.sha }}
          path: ci-output/report/last-run.json
          if-no-files-found: error
          retention-days: 14
