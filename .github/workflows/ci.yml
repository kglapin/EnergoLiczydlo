name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Lint with ruff
        run: >-
          ruff check app tests --output-format=github
          --extend-per-file-ignores "tests/test_full_technical_audit.py:I001"
          --extend-per-file-ignores "tests/test_full_technical_audit.py:F841"
      - name: Type check with mypy
        shell: bash
        run: |
          set +e
          mypy app --show-error-codes --no-pretty | tee /tmp/mypy.txt
          status=${PIPESTATUS[0]}
          {
            echo "### mypy"
            echo '```text'
            cat /tmp/mypy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Run full technical audit tests
        continue-on-error: true
        run: |
          pytest tests/test_full_technical_audit.py -s -vv -rxX
      - name: Run external BESTEST Case 600 audit
        continue-on-error: true
        env:
          RUN_EXTERNAL_BENCHMARKS: "1"
        run: |
          pytest \
            tests/test_external_bestest.py::test_external_bestest_case_600_is_inside_published_reference_band \
            tests/test_external_bestest_audit_values.py::test_report_exact_bestest_case_600_values \
            -s -vv
      - name: Run production regression tests
        shell: bash
        run: |
          set +e
          pytest tests -q --ignore=tests/test_full_technical_audit.py --cov=app --cov-report=term-missing 2>&1 | tee /tmp/pytest.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path

          text = Path("/tmp/pytest.txt").read_text(encoding="utf-8")[-6000:]
          escaped = (
              text.replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
          )
          print(f"::error title=pytest failure::{escaped}")
          PY
          fi
          exit "$status"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Build
        run: pnpm build
