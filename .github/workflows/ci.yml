name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Lint with ruff
        run: >-
          ruff check app tests --output-format=github
          --extend-per-file-ignores "app/engine/calculator/__init__.py:E402"
          --extend-per-file-ignores "app/engine/calculator/__init__.py:F821"
          --extend-per-file-ignores "app/engine/climate/__init__.py:F821"
          --extend-per-file-ignores "app/engine/design_load/__init__.py:E501"
          --extend-per-file-ignores "app/engine/ground_iso13370/__init__.py:F821"
          --extend-per-file-ignores "app/engine/heat_recovery/__init__.py:F821"
          --extend-per-file-ignores "app/engine/thermal_balance/__init__.py:F821"
          --extend-per-file-ignores "app/engine/ventilation/__init__.py:F821"
          --extend-per-file-ignores "tests/test_audit_repairs.py:I001"
          --extend-per-file-ignores "tests/test_post_repair_audit.py:I001"
          --extend-per-file-ignores "tests/test_post_repair_audit.py:E501"
          --extend-per-file-ignores "tests/test_post_repair_audit.py:F401"
          --extend-per-file-ignores "tests/test_external_bestest_repaired.py:I001"
          --extend-per-file-ignores "tests/test_external_bestest_repaired.py:E501"
      - name: Type check ISO 52016 numerical modules with mypy
        shell: bash
        run: |
          set +e
          mypy \
            app/engine/iso52016_hourly.py \
            app/engine/iso52016_monthly.py \
            app/engine/iso52016_moisture.py \
            app/engine/iso52016_design_load.py \
            --follow-imports=skip \
            --disable-error-code=no-untyped-def \
            --show-error-codes --no-pretty | tee /tmp/mypy.txt
          status=${PIPESTATUS[0]}
          {
            echo "### mypy — ISO 52016 numerical modules"
            echo '```text'
            cat /tmp/mypy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Run ISO 52016 conformance regressions
        run: >-
          pytest
          tests/test_iso52016_conformance.py
          tests/test_iso52016_monthly.py
          tests/test_iso52016_design_load.py
          -q -vv
      - name: Run audit repair regressions
        run: pytest tests/test_audit_repairs.py -q -vv
      - name: Run independent post-repair audit
        run: pytest tests/test_post_repair_audit.py -q -vv -s
      - name: Run repaired BESTEST Case 600
        env:
          RUN_EXTERNAL_BENCHMARKS: "1"
        run: >-
          pytest
          tests/test_external_bestest_repaired.py::test_repaired_solver_bestest_case_600_is_inside_published_reference_band
          -q -vv -s
      - name: Run full backend regression suite
        shell: bash
        run: |
          set +e
          pytest tests -q --cov=app --cov-report=term-missing 2>&1 | tee /tmp/pytest.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path

          text = Path("/tmp/pytest.txt").read_text(encoding="utf-8")[-6000:]
          escaped = (
              text.replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
          )
          print(f"::error title=pytest failure::{escaped}")
          PY
          fi
          exit "$status"
      - name: Publish backend result as commit status
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Backend, ISO conformance and BESTEST passed"
          else
            state="failure"
            description="Backend validation failed"
          fi
          jq -n \
            --arg state "$state" \
            --arg context "energoliczydlo/backend" \
            --arg description "$description" \
            '{state:$state, context:$context, description:$description}' \
            > /tmp/status.json
          curl --fail-with-body -L \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -d @/tmp/status.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Publish frontend result as commit status
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Frontend lint, typecheck and build passed"
          else
            state="failure"
            description="Frontend validation failed"
          fi
          jq -n \
            --arg state "$state" \
            --arg context "energoliczydlo/frontend" \
            --arg description "$description" \
            '{state:$state, context:$context, description:$description}' \
            > /tmp/status.json
          curl --fail-with-body -L \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -d @/tmp/status.json
