name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Lint with ruff
        run: ruff check app tests --output-format=github
      - name: Type check with mypy
        shell: bash
        run: |
          set +e
          mypy app --show-error-codes --no-pretty | tee /tmp/mypy.txt
          status=${PIPESTATUS[0]}
          {
            echo "### mypy"
            echo '```text'
            cat /tmp/mypy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Run tests
        shell: bash
        run: |
          set +e
          pytest tests -q --cov=app --cov-report=term-missing 2>&1 | tee /tmp/pytest.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path

          text = Path("/tmp/pytest.txt").read_text(encoding="utf-8")[-6000:]
          escaped = (
              text.replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
          )
          print(f"::error title=pytest failure::{escaped}")
          PY
          fi
          exit "$status"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Build
        run: pnpm build
